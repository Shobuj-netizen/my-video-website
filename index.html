<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Video Website</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    background:#222;
    padding:15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:24px;
}

.container{
    width:95%;
    max-width:900px;
    margin:auto;
}

.search{
    margin:15px 0;
}

.search input{
    width:100%;
    padding:13px;
    border-radius:6px;
    border:none;
    font-size:16px;
}

/* Video List */
.video-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.card{
    background:#222;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
}

.thumbnail{
    width:100%;
    height:230px;
    background:#333;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.placeholder{
    color:#aaa;
    font-size:18px;
}

.card-info{
    padding:12px;
}

.card-info h3{
    margin:0 0 6px;
    font-size:18px;
}

.card-info p{
    margin:0;
    color:#aaa;
}

/* Pagination */
.pagination{
    display:flex;
    justify-content:center;
    gap:7px;
    margin:25px 0;
    flex-wrap:wrap;
}

.pagination button{
    background:#333;
    color:#fff;
    border:none;
    padding:9px 13px;
    border-radius:5px;
    cursor:pointer;
}

.pagination button.active{
    background:#e50914;
}

/* Ads */
.ad{
    background:#222;
    border:1px dashed #555;
    color:#888;
    text-align:center;
    padding:18px;
    margin:15px 0;
}

/* Player */
#player{
    display:none;
    background:#000;
    padding:10px;
    position:fixed;
    inset:0;
    z-index:9999;
    overflow-y:auto;
}

.player-box{
    max-width:900px;
    margin:auto;
}

.close-btn{
    background:#e50914;
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:5px;
    cursor:pointer;
    margin-bottom:10px;
}

#videoPlayer{
    width:100%;
    max-height:70vh;
    background:#000;
}

.player-title{
    font-size:20px;
    margin:12px 0;
}

/* Recommended */
.recommended{
    margin-top:20px;
}

.recommended h2{
    font-size:20px;
}

.recommended-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.recommend-card{
    display:flex;
    background:#222;
    border-radius:6px;
    overflow:hidden;
    cursor:pointer;
}

.recommend-thumb{
    width:130px;
    height:80px;
    background:#333;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.recommend-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.recommend-info{
    padding:10px;
}

.recommend-info h3{
    margin:0;
    font-size:15px;
}

@media(max-width:600px){

    .thumbnail{
        height:210px;
    }

    .recommend-thumb{
        width:110px;
        height:70px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎬 My Video Website</h1>
</header>

<div class="container">

    <div class="search">
        <input
            type="text"
            id="searchInput"
            placeholder="ভিডিও খুঁজুন..."
            oninput="searchVideos()"
        >
    </div>

    <div class="ad">
        Advertisement
    </div>

    <div id="videoList" class="video-list"></div>

    <div id="pagination" class="pagination"></div>

</div>


<!-- VIDEO PLAYER -->

<div id="player">

    <div class="player-box">

        <button class="close-btn" onclick="closePlayer()">
            ← Back
        </button>

        <div class="ad">
            Advertisement
        </div>

        <div id="playerTitle" class="player-title"></div>

        <video
            id="videoPlayer"
            controls
            controlsList="nodownload"
            oncontextmenu="return false;"
            playsinline
        >
            <source id="videoSource" src="" type="video/mp4">
        </video>

        <div class="recommended">

            <h2>Recommended Videos</h2>

            <div
                id="recommendedList"
                class="recommended-list"
            ></div>

        </div>

    </div>

</div>


<script>

/* =========================
   VIDEO DATA
========================= */

const videos = [

    {
        id:1,
        title:"আমার প্রথম ভিডিও",
        file:"salar1.mp4"
    },

    {
        id:2,
        title:"দ্বিতীয় ভিডিও",
        file:"video2.mp4"
    },

    {
        id:3,
        title:"তৃতীয় ভিডিও",
        file:""
    },

    {
        id:4,
        title:"চতুর্থ ভিডিও",
        file:""
    },

    {
        id:5,
        title:"পঞ্চম ভিডিও",
        file:""
    },

    {
        id:6,
        title:"ষষ্ঠ ভিডিও",
        file:""
    },

    {
        id:7,
        title:"সপ্তম ভিডিও",
        file:""
    },

    {
        id:8,
        title:"অষ্টম ভিডিও",
        file:""
    },

    {
        id:9,
        title:"নবম ভিডিও",
        file:""
    },

    {
        id:10,
        title:"দশম ভিডিও",
        file:""
    },

    {
        id:11,
        title:"১১ নম্বর ভিডিও",
        file:""
    },

    {
        id:12,
        title:"১২ নম্বর ভিডিও",
        file:""
    }

];


/* =========================
   SETTINGS
========================= */

const videosPerPage = 10;

let currentPage = 1;

let filteredVideos = videos;


/* =========================
   SHOW VIDEOS
========================= */

function showVideos(){

    const list =
        document.getElementById("videoList");

    list.innerHTML = "";

    const start =
        (currentPage - 1) * videosPerPage;

    const end =
        start + videosPerPage;

    const pageVideos =
        filteredVideos.slice(start,end);


    pageVideos.forEach(video => {

        const card =
            document.createElement("div");

        card.className = "card";


        card.onclick = function(){

            if(video.file){

                playVideo(
                    video.file,
                    video.title,
                    video.id
                );

            }

        };


        const thumbnail =
            document.createElement("div");

        thumbnail.className =
            "thumbnail";


        /*
          যদি ভিডিও থাকে,
          তাহলে ভিডিও থেকেই
          অটোমেটিক thumbnail হবে
        */

        if(video.file){

            thumbnail.innerHTML = `
                <div class="placeholder">
                    Thumbnail loading...
                </div>
            `;

            generateThumbnail(
                video.file,
                thumbnail
            );

        }else{

            thumbnail.innerHTML = `
                <div class="placeholder">
                    🎬 ভিডিও নেই
                </div>
            `;

        }


        const info =
            document.createElement("div");

        info.className =
            "card-info";


        info.innerHTML = `
            <h3>${video.title}</h3>
            <p>ভিডিও</p>
        `;


        card.appendChild(thumbnail);

        card.appendChild(info);

        list.appendChild(card);

    });


    showPagination();

}


/* =========================
   AUTO THUMBNAIL
========================= */

function generateThumbnail(
    file,
    container
){

    const video =
        document.createElement("video");

    video.src = file;

    video.muted = true;

    video.playsInline = true;

    video.preload = "metadata";


    video.addEventListener(
        "loadedmetadata",
        function(){

            let time = 1;

            if(video.duration < 1){

                time = 0;

            }else if(video.duration < 5){

                time =
                    video.duration / 2;

            }


            video.currentTime = time;

        }
    );


    video.addEventListener(
        "seeked",
        function(){

            const canvas =
                document.createElement("canvas");


            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            const ctx =
                canvas.getContext("2d");


            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            const image =
                document.createElement("img");


            image.src =
                canvas.toDataURL("image/jpeg",0.8);


            image.alt =
                "Video Thumbnail";


            container.innerHTML = "";

            container.appendChild(image);


            video.remove();

        },
        {
            once:true
        }
    );


    video.addEventListener(
        "error",
        function(){

            container.innerHTML = `
                <div class="placeholder">
                    🎬 Thumbnail
                </div>
            `;

        }
    );

}


/* =========================
   PAGINATION
========================= */

function showPagination(){

    const pagination =
        document.getElementById(
            "pagination"
        );

    pagination.innerHTML = "";


    const totalPages =
        Math.ceil(
            filteredVideos.length /
            videosPerPage
        );


    for(
        let i=1;
        i<=totalPages;
        i++
    ){

        const button =
            document.createElement("button");


        button.innerText = i;


        if(i === currentPage){

            button.classList.add("active");

        }


        button.onclick = function(){

            currentPage = i;

            showVideos();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };


        pagination.appendChild(button);

    }

}


/* =========================
   PLAY VIDEO
========================= */

function playVideo(
    file,
    title,
    id
){

    const player =
        document.getElementById(
            "player"
        );


    const videoPlayer =
        document.getElementById(
            "videoPlayer"
        );


    const source =
        document.getElementById(
            "videoSource"
        );


    const playerTitle =
        document.getElementById(
            "playerTitle"
        );


    source.src = file;

    videoPlayer.load();


    playerTitle.innerText =
        title;


    player.style.display =
        "block";


    showRecommended(id);


    if(location.hash !== "#video"){

        history.pushState(
            {
                videoPlayer:true
            },
            "",
            "#video"
        );

    }


    videoPlayer.play()
        .catch(function(error){

            console.log(
                "Video play error:",
                error
            );

        });

}


/* =========================
   CLOSE PLAYER
========================= */

function closePlayer(){

    const player =
        document.getElementById(
            "player"
        );


    const videoPlayer =
        document.getElementById(
            "videoPlayer"
        );


    videoPlayer.pause();

    videoPlayer.currentTime = 0;

    player.style.display =
        "none";


    if(location.hash === "#video"){

        history.back();

    }

}


/* =========================
   ANDROID BACK BUTTON
========================= */

window.addEventListener(
    "popstate",
    function(){

        const player =
            document.getElementById(
                "player"
            );


        const videoPlayer =
            document.getElementById(
                "videoPlayer"
            );


        if(
            player.style.display ===
            "block"
        ){

            videoPlayer.pause();

            videoPlayer.currentTime = 0;

            player.style.display =
                "none";

        }

    }
);


/* =========================
   RECOMMENDED VIDEOS
========================= */

function showRecommended(
    currentId
){

    const list =
        document.getElementById(
            "recommendedList"
        );


    list.innerHTML = "";


    const recommended =
        videos
        .filter(video =>
            video.id !== currentId &&
            video.file
        )
        .slice(0,6);


    recommended.forEach(video => {

        const card =
            document.createElement("div");


        card.className =
            "recommend-card";


        card.onclick = function(){

            playVideo(
                video.file,
                video.title,
                video.id
            );

        };


        const thumb =
            document.createElement("div");


        thumb.className =
            "recommend-thumb";


        thumb.innerHTML = `
            <div class="placeholder">
                🎬
            </div>
        `;


        generateThumbnail(
            video.file,
            thumb
        );


        const info =
            document.createElement("div");


        info.className =
            "recommend-info";


        info.innerHTML = `
            <h3>${video.title}</h3>
        `;


        card.appendChild(thumb);

        card.appendChild(info);

        list.appendChild(card);

    });

}


/* =========================
   SEARCH
========================= */

function searchVideos(){

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase();


    filteredVideos =
        videos.filter(video =>
            video.title
            .toLowerCase()
            .includes(search)
        );


    currentPage = 1;

    showVideos();

}


/* =========================
   START
========================= */

showVideos();

</script>

</body>
</html>
