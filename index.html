<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viral Link</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

/* HEADER */

header{
    text-align:center;
    padding:15px 10px 12px;
    background:#151515;
    border-bottom:1px solid #292929;
}

.site-logo{
    width:60px;
    height:60px;
    object-fit:contain;
    display:block;
    margin:auto;
}

header h1{
    margin:6px 0 0;
    font-size:25px;
    font-weight:bold;
    letter-spacing:1px;
}

/* SEARCH */

.search-box{
    padding:15px 10px;
    max-width:700px;
    margin:auto;
}

.search-box input{
    width:100%;
    padding:13px 15px;
    border:none;
    outline:none;
    border-radius:8px;
    background:#222;
    color:white;
    font-size:16px;
}

/* VIDEO LIST */

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:10px;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

/* CARD */

.card{
    background:#1c1c1c;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid #292929;
    transition:0.2s;
}

.card:hover{
    background:#242424;
    transform:translateY(-2px);
}

/* THUMBNAIL */

.thumbnail{
    width:100%;
    height:230px;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.placeholder{
    color:#aaa;
    font-size:17px;
}

/* PLAY BUTTON */

.play-button{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:58px;
    height:58px;

    border-radius:50%;

    background:rgba(229,9,20,0.95);
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
    padding-left:3px;

    box-shadow:0 3px 15px rgba(0,0,0,0.6);

    z-index:5;
}

/* CARD INFO */

.card-info{
    padding:13px;
}

.card-info h3{
    margin:0 0 6px;
    font-size:18px;
    font-weight:bold;
    color:white;
}

.card-info p{
    margin:0;
    color:#999;
    font-size:13px;
}

/* BANNER AD */

.banner-ad{
    width:100%;
    min-height:70px;
    background:#181818;
    border:1px dashed #444;
    border-radius:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#777;
    font-size:14px;
}

/* PLAYER */

#player{
    display:none;
    position:fixed;
    z-index:9999;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:#000;
}

.player-top{
    width:100%;
    height:55px;

    display:flex;
    align-items:center;

    padding:0 10px;

    background:#111;
}

.close-btn{
    background:none;
    border:none;
    color:white;

    font-size:30px;

    cursor:pointer;

    width:45px;
    height:45px;
}

.player-title{
    font-size:17px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    margin-left:5px;
}

.player-video-box{
    width:100%;
    height:calc(100% - 55px);

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;
}

#videoPlayer{
    width:100%;
    max-height:100%;
    background:#000;
}

/* RECOMMENDED */

.recommended{
    margin-top:25px;
}

.recommended h2{
    font-size:20px;
    margin-bottom:12px;
}

.recommend-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.recommend-card{
    display:flex;
    gap:10px;

    background:#1c1c1c;
    padding:8px;

    border-radius:8px;

    cursor:pointer;
}

.recommend-thumb{
    width:110px;
    height:70px;

    background:#333;

    border-radius:5px;

    overflow:hidden;

    flex-shrink:0;
}

.recommend-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.recommend-info{
    padding:5px;
}

.recommend-info h3{
    margin:0;

    font-size:15px;
    color:white;
}

/* PAGINATION */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;

    gap:7px;

    margin:25px 0;
    flex-wrap:wrap;
}

.pagination button{
    border:none;

    background:#222;
    color:white;

    padding:9px 13px;

    border-radius:6px;

    cursor:pointer;
}

.pagination button.active{
    background:#e50914;
}

.pagination button:hover{
    background:#e50914;
}

/* FOOTER */

footer{
    text-align:center;

    color:#777;

    font-size:13px;

    padding:25px 10px;
}

/* MOBILE */

@media(max-width:600px){

    .thumbnail{
        height:210px;
    }

    header h1{
        font-size:21px;
    }

    .play-button{
        width:55px;
        height:55px;
        font-size:24px;
    }

    .recommend-thumb{
        width:110px;
        height:70px;
    }
}

</style>
</head>


<body>


<!-- HEADER -->

<header>

    <img
        src="logo.png"
        alt="Viral Link"
        class="site-logo"
    >

    <h1>Viral Link</h1>

</header>


<!-- SEARCH -->

<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="ভিডিও খুঁজুন..."
        oninput="searchVideos()"
    >

</div>


<!-- VIDEO AREA -->

<div class="container">

    <div
        id="videoList"
        class="video-list"
    ></div>


    <!-- PAGINATION -->

    <div
        id="pagination"
        class="pagination"
    ></div>


    <!-- RECOMMENDED -->

    <div class="recommended">

        <h2>Recommended Videos</h2>

        <div
            id="recommendList"
            class="recommend-list"
        ></div>

    </div>

</div>


<!-- VIDEO PLAYER -->

<div id="player">

    <div class="player-top">

        <button
            class="close-btn"
            onclick="closePlayer()"
        >
            ×
        </button>

        <div
            id="playerTitle"
            class="player-title"
        >
            Video
        </div>

    </div>


    <div class="player-video-box">

        <video
            id="videoPlayer"
            controls
            controlsList="nodownload"
            oncontextmenu="return false;"
        >

            <source
                id="videoSource"
                src=""
                type="video/mp4"
            >

            Your browser does not support video.

        </video>

    </div>

</div>


<footer>

    © 2026 Viral Link

</footer>



<script>

/* =========================
   VIDEO DATA
========================= */

const videos = [

    {
        id:1,
        title:"আমার প্রথম ভিডিও",
        file:"salar1.mp4"
    },

    {
        id:2,
        title:"দ্বিতীয় ভিডিও",
        file:"video2.mp4"
    },

    {
        id:3,
        title:"New viral",
        file:"video3.mp4"
    },

    {
        id:4,
        title:"চতুর্থ ভিডিও",
        file:""
    },

    {
        id:5,
        title:"পঞ্চম ভিডিও",
        file:""
    },

    {
        id:6,
        title:"ষষ্ঠ ভিডিও",
        file:""
    },

    {
        id:7,
        title:"সপ্তম ভিডিও",
        file:""
    },

    {
        id:8,
        title:"অষ্টম ভিডিও",
        file:""
    },

    {
        id:9,
        title:"নবম ভিডিও",
        file:""
    },

    {
        id:10,
        title:"দশম ভিডিও",
        file:""
    },

    {
        id:11,
        title:"১১ নম্বর ভিডিও",
        file:""
    },

    {
        id:12,
        title:"১২ নম্বর ভিডিও",
        file:""
    }

];


/* =========================
   SETTINGS
========================= */

const videosPerPage = 10;

let currentPage = 1;

let filteredVideos = videos;


/* =========================
   SHOW VIDEOS
========================= */

function showVideos(){

    const list =
        document.getElementById("videoList");

    list.innerHTML = "";


    const start =
        (currentPage - 1) * videosPerPage;


    const end =
        start + videosPerPage;


    const pageVideos =
        filteredVideos.slice(start,end);


    pageVideos.forEach(function(video,index){

        const card =
            document.createElement("div");

        card.className = "card";


        card.onclick = function(){

            if(video.file){

                playVideo(
                    video.file,
                    video.title,
                    video.id
                );

            }

        };


        const thumbnail =
            document.createElement("div");

        thumbnail.className = "thumbnail";


        /* VIDEO EXISTS */

        if(video.file){

            thumbnail.innerHTML = `

                <div class="placeholder">
                    Thumbnail loading...
                </div>

                <div class="play-button">
                    ▶
                </div>

            `;


            generateThumbnail(
                video.file,
                thumbnail
            );

        }


        /* VIDEO NOT UPLOADED */

        else{

            thumbnail.innerHTML = `

                <div class="placeholder">
                    Video Coming Soon
                </div>

            `;

        }


        const info =
            document.createElement("div");

        info.className = "card-info";


        info.innerHTML = `

            <h3>
                ${video.title}
            </h3>

            <p>
                Video
            </p>

        `;


        card.appendChild(thumbnail);

        card.appendChild(info);

        list.appendChild(card);


        /* BANNER AFTER EVERY 2 VIDEOS */

        if(
            (index + 1) % 2 === 0 &&
            index !== pageVideos.length - 1
        ){

            const ad =
                document.createElement("div");

            ad.className = "banner-ad";

            ad.innerHTML =
                "ADVERTISEMENT";

            list.appendChild(ad);

        }

    });


    showPagination();

}


/* =========================
   GENERATE THUMBNAIL
========================= */

function generateThumbnail(
    file,
    container
){

    const video =
        document.createElement("video");


    video.src =
        "./" + file;


    video.muted = true;

    video.preload = "metadata";


    video.addEventListener(
        "loadeddata",
        function(){

            try{

                video.currentTime = 1;

            }
            catch(error){

                createThumbnailImage(
                    video,
                    container
                );

            }

        }
    );


    video.addEventListener(
        "seeked",
        function(){

            createThumbnailImage(
                video,
                container
            );

        }
    );


    video.addEventListener(
        "error",
        function(){

            container.innerHTML = `

                <div class="placeholder">
                    Thumbnail unavailable
                </div>

                <div class="play-button">
                    ▶
                </div>

            `;

        }
    );

}


/* =========================
   CREATE THUMBNAIL IMAGE
========================= */

function createThumbnailImage(
    video,
    container
){

    const canvas =
        document.createElement("canvas");


    canvas.width = 640;

    canvas.height = 360;


    const ctx =
        canvas.getContext("2d");


    try{

        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const image =
            document.createElement("img");


        image.src =
            canvas.toDataURL(
                "image/jpeg",
                0.85
            );


        image.alt =
            "Video thumbnail";


        container.innerHTML = "";

        container.appendChild(image);


        /* ADD PLAY BUTTON AGAIN */

        const playButton =
            document.createElement("div");


        playButton.className =
            "play-button";


        playButton.innerText =
            "▶";


        container.appendChild(
            playButton
        );

    }
    catch(error){

        container.innerHTML = `

            <div class="placeholder">
                Thumbnail unavailable
            </div>

            <div class="play-button">
                ▶
            </div>

        `;

    }

}


/* =========================
   PLAY VIDEO
========================= */

function playVideo(
    file,
    title,
    id
){

    const player =
        document.getElementById("player");


    const videoPlayer =
        document.getElementById(
            "videoPlayer"
        );


    const source =
        document.getElementById(
            "videoSource"
        );


    const playerTitle =
        document.getElementById(
            "playerTitle"
        );


    /* IMPORTANT */

    source.src =
        "./" + file;


    videoPlayer.load();


    playerTitle.innerText =
        title;


    player.style.display =
        "block";


    /* BACK BUTTON SUPPORT */

    if(
        location.hash !== "#video"
    ){

        history.pushState(
            {
                videoPlayer:true
            },
            "",
            "#video"
        );

    }


    videoPlayer.play().catch(
        function(error){

            console.log(
                "Video play error:",
                error
            );

        }
    );

}


/* =========================
   CLOSE PLAYER
========================= */

function closePlayer(){

    const player =
        document.getElementById(
            "player"
        );


    const videoPlayer =
        document.getElementById(
            "videoPlayer"
        );


    videoPlayer.pause();


    videoPlayer.currentTime =
        0;


    player.style.display =
        "none";


    if(
        location.hash === "#video"
    ){

        history.back();

    }

}


/* =========================
   ANDROID BACK BUTTON
========================= */

window.addEventListener(
    "popstate",
    function(){

        const player =
            document.getElementById(
                "player"
            );


        const videoPlayer =
            document.getElementById(
                "videoPlayer"
            );


        if(
            player.style.display ===
            "block"
        ){

            videoPlayer.pause();

            videoPlayer.currentTime =
                0;

            player.style.display =
                "none";

        }

    }
);


/* =========================
   PAGINATION
========================= */

function showPagination(){

    const pagination =
        document.getElementById(
            "pagination"
        );


    pagination.innerHTML = "";


    const totalPages =
        Math.ceil(
            filteredVideos.length /
            videosPerPage
        );


    if(totalPages <= 1){

        return;

    }


    /* PREVIOUS */

    if(currentPage > 1){

        const previous =
            document.createElement(
                "button"
            );


        previous.innerText =
            "‹";


        previous.onclick =
            function(){

                currentPage--;

                showVideos();

                window.scrollTo(
                    0,
                    0
                );

            };


        pagination.appendChild(
            previous
        );

    }


    /* PAGE NUMBERS */

    for(
        let i = 1;
        i <= totalPages;
        i++
    ){

        const button =
            document.createElement(
                "button"
            );


        button.innerText =
            i;


        if(
            i === currentPage
        ){

            button.className =
                "active";

        }


        button.onclick =
            function(){

                currentPage =
                    i;

                showVideos();

                window.scrollTo(
                    0,
                    0
                );

            };


        pagination.appendChild(
            button
        );

    }


    /* NEXT */

    if(
        currentPage < totalPages
    ){

        const next =
            document.createElement(
                "button"
            );


        next.innerText =
            "›";


        next.onclick =
            function(){

                currentPage++;

                showVideos();

                window.scrollTo(
                    0,
                    0
                );

            };


        pagination.appendChild(
            next
        );

    }

}


/* =========================
   SEARCH
========================= */

function searchVideos(){

    const input =
        document.getElementById(
            "searchInput"
        );


    const searchText =
        input.value
        .toLowerCase()
        .trim();


    filteredVideos =
        videos.filter(
            function(video){

                return video.title
                    .toLowerCase()
                    .includes(searchText);

            }
        );


    currentPage = 1;

    showVideos();

}


/* =========================
   RECOMMENDED VIDEOS
========================= */

function showRecommended(){

    const list =
        document.getElementById(
            "recommendList"
        );


    list.innerHTML = "";


    const recommended =
        videos
        .filter(
            function(video){

                return video.file;

            }
        )
        .slice(0,5);


    recommended.forEach(
        function(video){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "recommend-card";


            card.onclick =
                function(){

                    playVideo(
                        video.file,
                        video.title,
                        video.id
                    );

                };


            const thumb =
                document.createElement(
                    "div"
                );


            thumb.className =
                "recommend-thumb";


            const img =
                document.createElement(
                    "img"
                );


            img.alt =
                video.title;


            thumb.appendChild(
                img
            );


            /* MAKE RECOMMEND THUMBNAIL */

            makeRecommendedThumbnail(
                video.file,
                img
            );


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "recommend-info";


            info.innerHTML = `

                <h3>
                    ${video.title}
                </h3>

            `;


            card.appendChild(
                thumb
            );


            card.appendChild(
                info
            );


            list.appendChild(
                card
            );

        }
    );

}


/* =========================
   RECOMMENDED THUMBNAIL
========================= */

function makeRecommendedThumbnail(
    file,
    image
){

    const video =
        document.createElement(
            "video"
        );


    video.src =
        "./" + file;


    video.muted = true;

    video.preload =
        "metadata";


    video.addEventListener(
        "loadeddata",
        function(){

            try{

                video.currentTime = 1;

            }
            catch(e){}

        }
    );


    video.addEventListener(
        "seeked",
        function(){

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width = 320;

            canvas.height = 180;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            try{

                ctx.drawImage(
                    video,
                    0,
                    0,
                    320,
                    180
                );


                image.src =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.8
                    );

            }
            catch(e){}

        }
    );

}


/* =========================
   START WEBSITE
========================= */

showVideos();

showRecommended();

</script>

</body>
</html>
