<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viral Link</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    padding:15px 10px;
    background:#151515;
    border-bottom:1px solid #292929;
}

.site-logo{
    width:60px;
    height:60px;
    object-fit:contain;
    display:block;
    margin:auto;
}

header h1{
    margin:6px 0 0;
    font-size:25px;
}

.search-box{
    padding:15px 10px;
    max-width:700px;
    margin:auto;
}

.search-box input{
    width:100%;
    padding:13px 15px;
    border:0;
    outline:0;
    border-radius:8px;
    background:#222;
    color:#fff;
    font-size:16px;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:10px;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.card{
    background:#1c1c1c;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid #292929;
}

.thumbnail{
    width:100%;
    height:230px;
    background:#222;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.placeholder{
    color:#aaa;
}

.play-button{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:58px;
    height:58px;
    border-radius:50%;
    background:rgba(229,9,20,.95);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:25px;
    z-index:5;
}

.card-info{
    padding:13px;
}

.card-info h3{
    margin:0 0 6px;
    font-size:18px;
}

.card-info p{
    margin:0;
    color:#999;
    font-size:13px;
}

.banner-ad{
    width:100%;
    min-height:70px;
    background:#181818;
    border:1px dashed #444;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    font-size:14px;
}

.pagination{
    display:flex;
    justify-content:center;
    gap:7px;
    margin:25px 0;
}

.pagination button{
    border:0;
    background:#222;
    color:#fff;
    padding:9px 13px;
    border-radius:6px;
}

.pagination button.active{
    background:#e50914;
}

@media(max-width:600px){

    .thumbnail{
        height:210px;
    }

    header h1{
        font-size:21px;
    }
}
</style>
</head>

<body>

<header>
    <img src="logo.png" class="site-logo" alt="Viral Link">
    <h1>Viral Link</h1>
</header>

<div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="ভিডিও খুঁজুন..."
        oninput="searchVideos()"
    >
</div>

<div class="container">

    <div id="videoList" class="video-list"></div>

    <div id="pagination" class="pagination"></div>

</div>

<!-- ভিডিওর তালিকা -->
<script src="videos.js"></script>

<script>

const videosPerPage = 10;

let currentPage = 1;

let filteredVideos = videos;


function showVideos(){

    const list =
        document.getElementById("videoList");

    list.innerHTML = "";

    const start =
        (currentPage - 1) * videosPerPage;

    const end =
        start + videosPerPage;

    const pageVideos =
        filteredVideos.slice(start,end);


    pageVideos.forEach(function(video,index){

        const card =
            document.createElement("div");

        card.className = "card";


        card.onclick = function(){

            if(video.file){

                window.location.href =
                    "watch.html?video=" +
                    video.id;

            }

        };


        const thumbnail =
            document.createElement("div");

        thumbnail.className =
            "thumbnail";


        if(video.file){

            thumbnail.innerHTML = `
                <div class="placeholder">
                    Thumbnail loading...
                </div>

                <div class="play-button">
                    ▶
                </div>
            `;

            generateThumbnail(
                video.file,
                thumbnail
            );

        }
        else{

            thumbnail.innerHTML = `
                <div class="placeholder">
                    Video Coming Soon
                </div>
            `;

        }


        const info =
            document.createElement("div");

        info.className =
            "card-info";


        info.innerHTML = `
            <h3>${video.title}</h3>
            <p>Video</p>
        `;


        card.appendChild(thumbnail);

        card.appendChild(info);

        list.appendChild(card);


        if(
            (index + 1) % 2 === 0 &&
            index !== pageVideos.length - 1
        ){

            const ad =
                document.createElement("div");

            ad.className =
                "banner-ad";

            ad.innerText =
                "ADVERTISEMENT";

            list.appendChild(ad);

        }

    });


    showPagination();

}


function generateThumbnail(
    file,
    container
){

    const video =
        document.createElement("video");

    video.src =
        "./" + file;

    video.muted = true;

    video.preload =
        "metadata";


    video.addEventListener(
        "loadeddata",
        function(){

            try{

                video.currentTime = 1;

            }
            catch(e){}

        }
    );


    video.addEventListener(
        "seeked",
        function(){

            const canvas =
                document.createElement("canvas");

            canvas.width = 640;

            canvas.height = 360;


            const ctx =
                canvas.getContext("2d");


            try{

                ctx.drawImage(
                    video,
                    0,
                    0,
                    640,
                    360
                );


                const img =
                    document.createElement("img");

                img.src =
                    canvas.toDataURL(
                        "image/jpeg",
                        .85
                    );


                container.innerHTML = "";

                container.appendChild(img);


                const play =
                    document.createElement("div");

                play.className =
                    "play-button";

                play.innerText =
                    "▶";


                container.appendChild(play);

            }
            catch(e){}

        }
    );

}


function searchVideos(){

    const text =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    filteredVideos =
        videos.filter(function(video){

            return video.title
                .toLowerCase()
                .includes(text);

        });


    currentPage = 1;

    showVideos();

}


function showPagination(){

    const pagination =
        document.getElementById(
            "pagination"
        );

    pagination.innerHTML = "";


    const totalPages =
        Math.ceil(
            filteredVideos.length /
            videosPerPage
        );


    if(totalPages <= 1){

        return;

    }


    for(
        let i = 1;
        i <= totalPages;
        i++
    ){

        const button =
            document.createElement(
                "button"
            );


        button.innerText = i;


        if(i === currentPage){

            button.className =
                "active";

        }


        button.onclick =
            function(){

                currentPage = i;

                showVideos();

                window.scrollTo(
                    0,
                    0
                );

            };


        pagination.appendChild(button);

    }

}


showVideos();

</script>

</body>
</html>
