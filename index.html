<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Video World</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
}

header{
    background:#181818;
    padding:18px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#e50914;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.hero{
    padding:60px 6%;
    background:linear-gradient(90deg,#111 30%,#222);
}

.hero h1{
    font-size:40px;
    margin-bottom:15px;
}

.hero p{
    color:#ccc;
    max-width:600px;
}

.search{
    padding:25px 6%;
    text-align:center;
}

.search input{
    width:90%;
    max-width:600px;
    padding:14px;
    border:none;
    border-radius:5px;
    font-size:16px;
}

.categories{
    padding:10px 6%;
}

.categories button{
    padding:10px 18px;
    margin:5px;
    border:0;
    border-radius:5px;
    background:#e50914;
    color:white;
    cursor:pointer;
}

.videos{
    padding:25px 6%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#1d1d1d;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
}

.card img{
    width:100%;
    height:280px;
    object-fit:cover;
}

.card h3{
    padding:12px;
}

.ad{
    margin:25px 6%;
    height:100px;
    background:#222;
    border:1px dashed #555;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#aaa;
}

.player{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    z-index:999;
    padding:50px 5%;
}

.player video{
    width:100%;
    max-width:1000px;
    display:block;
    margin:auto;
    max-height:75vh;
}

.close{
    position:absolute;
    right:25px;
    top:15px;
    font-size:35px;
    cursor:pointer;
}

footer{
    margin-top:40px;
    padding:30px;
    text-align:center;
    background:#181818;
    color:#888;
}

@media(max-width:600px){
    .hero h1{
        font-size:28px;
    }

    nav a{
        margin-left:8px;
        font-size:13px;
    }

    .card img{
        height:220px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MY VIDEO WORLD</div>

    <nav>
        <a href="#">Home</a>
        <a href="#videos">Videos</a>
        <a href="#categories">Categories</a>
    </nav>
</header>


<section class="hero">
    <h1>আপনার পছন্দের ভিডিও দেখুন</h1>
    <p>
        বিভিন্ন ধরনের ভিডিও এক জায়গায় দেখুন।
        অনলাইনে স্ট্রিমিং করুন সহজেই।
    </p>
</section>


<div class="search">
    <input
        type="text"
        id="search"
        placeholder="ভিডিও খুঁজুন..."
        onkeyup="searchVideo()"
    >
</div>


<section class="categories" id="categories">

    <button onclick="filterVideo('all')">সব</button>

    <button onclick="filterVideo('movie')">
        Movie
    </button>

    <button onclick="filterVideo('drama')">
        Drama
    </button>

    <button onclick="filterVideo('music')">
        Music
    </button>

</section>


<!-- Advertisement Area -->

<div class="ad">
    এখানে আপনার বিজ্ঞাপন কোড বসবে
</div>


<section class="videos" id="videos">

    <div class="card movie" onclick="playVideo('videos/video1.mp4')">

        <img src="https://via.placeholder.com/400x550">

        <h3>ভিডিও ১</h3>

    </div>


    <div class="card drama" onclick="playVideo('videos/video2.mp4')">

        <img src="https://via.placeholder.com/400x550">

        <h3>ড্রামা ভিডিও</h3>

    </div>


    <div class="card music" onclick="playVideo('videos/video3.mp4')">

        <img src="https://via.placeholder.com/400x550">

        <h3>মিউজিক ভিডিও</h3>

    </div>

</section>


<!-- Video Player -->

<div class="player" id="player">

    <span class="close" onclick="closePlayer()">×</span>

    <video
        id="videoPlayer"
        controls
        controlsList="nodownload"
        oncontextmenu="return false;"
    >
        <source id="videoSource" src="" type="video/mp4">
    </video>

</div>


<footer>
    © 2026 My Video World — All Rights Reserved
</footer>


<script>

function playVideo(video){

    const player =
        document.getElementById("player");

    const videoPlayer =
        document.getElementById("videoPlayer");

    const source =
        document.getElementById("videoSource");

    source.src = video;

    videoPlayer.load();

    player.style.display = "block";

    videoPlayer.play();

}


function closePlayer(){

    const player =
        document.getElementById("player");

    const videoPlayer =
        document.getElementById("videoPlayer");

    videoPlayer.pause();

    player.style.display = "none";

}


function searchVideo(){

    let input =
        document.getElementById("search")
        .value
        .toLowerCase();

    let cards =
        document.querySelectorAll(".card");

    cards.forEach(function(card){

        let title =
            card.innerText.toLowerCase();

        if(title.includes(input)){
            card.style.display = "block";
        }else{
            card.style.display = "none";
        }

    });

}


function filterVideo(category){

    let cards =
        document.querySelectorAll(".card");

    cards.forEach(function(card){

        if(category === "all"){
            card.style.display = "block";
        }

        else if(card.classList.contains(category)){
            card.style.display = "block";
        }

        else{
            card.style.display = "none";
        }

    });

}

</script>

</body>
  </html>
