<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Video World</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
}

/* HEADER */

header{
    background:#151515;
    padding:16px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #292929;
}

.logo{
    color:#e50914;
    font-size:24px;
    font-weight:bold;
    line-height:1.1;
}

nav{
    display:flex;
    gap:18px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:15px;
}

/* HERO */

.hero{
    padding:50px 6%;
    background:
    linear-gradient(90deg,#090909,#202020);
}

.hero h1{
    font-size:34px;
    margin-bottom:15px;
}

.hero p{
    color:#aaa;
    line-height:1.7;
}

/* SEARCH */

.search-box{
    padding:25px 6% 10px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:0;
    border-radius:7px;
    font-size:16px;
    outline:none;
}

/* AD */

.ad{
    margin:20px 6%;
    min-height:90px;
    border:1px dashed #555;
    background:#181818;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#888;
}

/* TITLE */

.section-title{
    padding:20px 6% 10px;
    font-size:24px;
}

/* VIDEO LIST */

.video-list{
    padding:10px 6% 30px;
}

/* VIDEO CARD */

.video-card{
    background:#181818;
    margin-bottom:15px;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    display:flex;
    min-height:150px;
}

.thumbnail{
    width:230px;
    min-width:230px;
    height:150px;
    object-fit:cover;
    background:
    linear-gradient(135deg,#491111,#111);
}

.placeholder{
    width:230px;
    min-width:230px;
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
    linear-gradient(135deg,#252525,#101010);
    font-size:20px;
    font-weight:bold;
}

.video-info{
    padding:18px;
}

.video-number{
    color:#e50914;
    font-size:14px;
    margin-bottom:8px;
}

.video-info h3{
    font-size:19px;
    margin-bottom:10px;
}

.video-info p{
    color:#888;
    font-size:14px;
}

/* PAGINATION */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:10px 6% 35px;
    flex-wrap:wrap;
}

.pagination button{
    border:0;
    background:#222;
    color:#fff;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

.pagination button.active{
    background:#e50914;
}

.pagination button:hover{
    background:#b20710;
}

/* PLAYER */

.player{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.97);
    overflow-y:auto;
    padding:55px 5% 30px;
}

.player video{
    width:100%;
    max-width:1000px;
    max-height:70vh;
    display:block;
    margin:auto;
    background:#000;
}

.close{
    position:absolute;
    right:18px;
    top:8px;
    color:#fff;
    font-size:38px;
    cursor:pointer;
}

/* PLAYER AD */

.player-ad{
    width:100%;
    max-width:1000px;
    min-height:70px;
    margin:20px auto;
    border:1px dashed #555;
    background:#181818;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
}

/* RECOMMENDED */

.recommended{
    width:100%;
    max-width:1000px;
    margin:30px auto 0;
}

.recommended h2{
    font-size:22px;
    margin-bottom:15px;
}

.recommend-list{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.recommend-card{
    background:#181818;
    border-radius:7px;
    overflow:hidden;
    cursor:pointer;
}

.recommend-thumb{
    height:110px;
    background:
    linear-gradient(135deg,#252525,#111);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:16px;
}

.recommend-info{
    padding:10px;
}

.recommend-info h3{
    font-size:14px;
}

/* FOOTER */

footer{
    background:#151515;
    color:#777;
    text-align:center;
    padding:30px 20px;
    margin-top:20px;
}

footer strong{
    color:#e50914;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:15px 5%;
    }

    .logo{
        font-size:20px;
    }

    nav{
        gap:10px;
    }

    nav a{
        font-size:12px;
    }

    .hero{
        padding:40px 6%;
    }

    .hero h1{
        font-size:27px;
    }

    .video-card{
        min-height:110px;
    }

    .thumbnail,
    .placeholder{
        width:120px;
        min-width:120px;
        height:110px;
    }

    .placeholder{
        font-size:14px;
    }

    .video-info{
        padding:12px;
    }

    .video-number{
        font-size:12px;
    }

    .video-info h3{
        font-size:15px;
    }

    .video-info p{
        font-size:12px;
    }

    .player{
        padding:50px 10px 25px;
    }

    .recommend-list{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>

<body>


<!-- HEADER -->

<header>

    <div class="logo">
        MY VIDEO<br>WORLD
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#videos">Videos</a>
    </nav>

</header>


<!-- HERO -->

<section class="hero">

    <h1>
        আপনার পছন্দের ভিডিও দেখুন
    </h1>

    <p>
        আপনার পছন্দের ভিডিও অনলাইনে দেখুন।
    </p>

</section>


<!-- SEARCH -->

<div class="search-box">

    <input
        type="text"
        id="search"
        placeholder="🔍 ভিডিও খুঁজুন..."
        onkeyup="searchVideo()"
    >

</div>


<!-- TOP AD -->

<div class="ad">

    এখানে বিজ্ঞাপনের কোড বসবে

</div>


<!-- VIDEO TITLE -->

<h2 class="section-title" id="videos">
    🎬 সকল ভিডিও
</h2>


<!-- VIDEO LIST -->

<section
    class="video-list"
    id="videoList"
>
</section>


<!-- PAGINATION -->

<div
    class="pagination"
    id="pagination"
></div>


<!-- BOTTOM AD -->

<div class="ad">

    আপনার বিজ্ঞাপনের জায়গা

</div>


<!-- VIDEO PLAYER -->

<div
    class="player"
    id="player"
>

    <div
        class="close"
        onclick="closePlayer()"
    >
        ×
    </div>


    <!-- PLAYER AD -->

    <div
        class="player-ad"
        id="playerAd"
    >
        ভিডিও চালু হওয়ার আগে বিজ্ঞাপনের জায়গা
    </div>


    <!-- VIDEO -->

    <video
        id="videoPlayer"
        controls
        controlsList="nodownload"
        oncontextmenu="return false;"
    >

        <source
            id="videoSource"
            src=""
            type="video/mp4"
        >

    </video>


    <!-- RECOMMENDED -->

    <div class="recommended">

        <h2>
            ▶ Recommended Videos
        </h2>

        <div
            class="recommend-list"
            id="recommendList"
        ></div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    © 2026
    <strong>My Video World</strong>

    <br><br>

    All Rights Reserved

</footer>


<script>

/* =====================================
   VIDEO DATABASE
   ===================================== */

const videos = [

    {
        id:1,
        title:"আমার প্রথম ভিডিও",
        file:"salar1.mp4",
        image:"ami.jpg"
    },

    {
        id:2,
        title:"দ্বিতীয় ভিডিও",
        file:"video2.mp4",
        image:""
    },

    {
        id:3,
        title:"তৃতীয় ভিডিও",
        file:"",
        image:""
    },

    {
        id:4,
        title:"চতুর্থ ভিডিও",
        file:"",
        image:""
    },

    {
        id:5,
        title:"পঞ্চম ভিডিও",
        file:"",
        image:""
    },

    {
        id:6,
        title:"ষষ্ঠ ভিডিও",
        file:"",
        image:""
    },

    {
        id:7,
        title:"সপ্তম ভিডিও",
        file:"",
        image:""
    },

    {
        id:8,
        title:"অষ্টম ভিডিও",
        file:"",
        image:""
    },

    {
        id:9,
        title:"নবম ভিডিও",
        file:"",
        image:""
    },

    {
        id:10,
        title:"দশম ভিডিও",
        file:"",
        image:""
    },

    {
        id:11,
        title:"১১ নম্বর ভিডিও",
        file:"",
        image:""
    },

    {
        id:12,
        title:"১২ নম্বর ভিডিও",
        file:"",
        image:""
    }

];


/* =====================================
   SETTINGS
   ===================================== */

const videosPerPage = 10;

let currentPage = 1;


/* =====================================
   SHOW VIDEOS
   ===================================== */

function showVideos(){

    const list =
        document.getElementById("videoList");

    list.innerHTML = "";

    const start =
        (currentPage - 1) * videosPerPage;

    const end =
        start + videosPerPage;

    const pageVideos =
        videos.slice(start,end);


    pageVideos.forEach(function(video){

        const card =
            document.createElement("div");

        card.className =
            "video-card";


        card.onclick = function(){

            if(video.file){

                playVideo(video.file);

            }else{

                alert(
                    "এই ভিডিওটি এখনো আপলোড করা হয়নি।"
                );

            }

        };


        let thumbnail;


        if(video.image){

            thumbnail =
                document.createElement("img");

            thumbnail.className =
                "thumbnail";

            thumbnail.src =
                video.image;

            thumbnail.alt =
                video.title;

        }else{

            thumbnail =
                document.createElement("div");

            thumbnail.className =
                "placeholder";

            thumbnail.innerHTML =
                "▶<br>VIDEO " +
                video.id;

        }


        const info =
            document.createElement("div");

        info.className =
            "video-info";


        info.innerHTML =

            "<div class='video-number'>" +
            "ভিডিও #" +
            video.id +
            "</div>" +

            "<h3>" +
            video.title +
            "</h3>" +

            "<p>" +
            "অনলাইনে দেখুন ▶" +
            "</p>";


        card.appendChild(thumbnail);

        card.appendChild(info);

        list.appendChild(card);

    });


    showPagination();

}


/* =====================================
   PAGINATION
   ===================================== */

function showPagination(){

    const pagination =
        document.getElementById("pagination");

    pagination.innerHTML = "";

    const totalPages =
        Math.ceil(
            videos.length /
            videosPerPage
        );


    if(totalPages <= 1){

        return;

    }


    for(
        let i = 1;
        i <= totalPages;
        i++
    ){

        const button =
            document.createElement("button");

        button.innerText = i;


        if(i === currentPage){

            button.className =
                "active";

        }


        button.onclick = function(){

            currentPage = i;

            showVideos();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };


        pagination.appendChild(button);

    }

}


/* =====================================
   PLAY VIDEO
   ===================================== */

function playVideo(video){

    const player =
        document.getElementById("player");

    const videoPlayer =
        document.getElementById("videoPlayer");

    const source =
        document.getElementById("videoSource");


    source.src =
        video;


    videoPlayer.load();


    player.style.display =
        "block";


    if(location.hash !== "#video"){

        history.pushState(
            {videoPlayer:true},
            "",
            "#video"
        );

    }


    videoPlayer.play().catch(function(error){

        console.log(
            "Video play error:",
            error
        );

    });


    showRecommended();

}


/* =====================================
   CLOSE VIDEO
   ===================================== */

function closePlayer(){

    const player =
        document.getElementById("player");

    const videoPlayer =
        document.getElementById("videoPlayer");


    videoPlayer.pause();

    videoPlayer.currentTime = 0;

    player.style.display =
        "none";


    if(location.hash === "#video"){

        history.back();

    }

}


/* =====================================
   ANDROID BACK BUTTON
   ===================================== */

window.addEventListener(
    "popstate",
    function(){

        const player =
            document.getElementById("player");

        const videoPlayer =
            document.getElementById("videoPlayer");


        if(
            player.style.display ===
            "block"
        ){

            videoPlayer.pause();

            videoPlayer.currentTime = 0;

            player.style.display =
                "none";

        }

    }
);


/* =====================================
   RECOMMENDED VIDEOS
   ===================================== */

function showRecommended(){

    const list =
        document.getElementById(
            "recommendList"
        );


    list.innerHTML = "";


    /*
       এখন প্রথম কয়েকটি ভিডিও
       Recommended হিসেবে দেখাবে।
    */

    const recommended =
        videos.slice(0,6);


    recommended.forEach(function(video){

        const card =
            document.createElement("div");

        card.className =
            "recommend-card";


        card.onclick =
            function(){

                if(video.file){

                    playVideo(
                        video.file
                    );

                }else{

                    alert(
                        "এই ভিডিওটি এখনো আপলোড করা হয়নি।"
                    );

                }

            };


        const thumb =
            document.createElement("div");

        thumb.className =
            "recommend-thumb";


        if(video.image){

            thumb.style.backgroundImage =
                "url('" +
                video.image +
                "')";

            thumb.style.backgroundSize =
                "cover";

            thumb.style.backgroundPosition =
                "center";

        }else{

            thumb.innerHTML =
                "▶ VIDEO " +
                video.id;

        }


        const info =
            document.createElement("div");

        info.className =
            "recommend-info";


        info.innerHTML =
            "<h3>" +
            video.title +
            "</h3>";


        card.appendChild(thumb);

        card.appendChild(info);

        list.appendChild(card);

    });

}


/* =====================================
   SEARCH
   ===================================== */

function searchVideo(){

    const input =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const cards =
        document.querySelectorAll(
            ".video-card"
        );


    cards.forEach(function(card){

        const text =
            card.innerText.toLowerCase();


        if(
            text.includes(input)
        ){

            card.style.display =
                "flex";

        }else{

            card.style.display =
                "none";

        }

    });

}


/* =====================================
   START
   ===================================== */

showVideos();

</script>


</body>
</html>
