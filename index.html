<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viral Link</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

/* HEADER */
header{
    text-align:center;
    padding:15px 10px 12px;
    background:#151515;
    border-bottom:1px solid #292929;
}

.site-logo{
    width:60px;
    height:60px;
    object-fit:contain;
    display:block;
    margin:auto;
}

header h1{
    margin:6px 0 0;
    font-size:25px;
}

/* SEARCH */
.search-box{
    padding:15px 10px;
    max-width:700px;
    margin:auto;
}

.search-box input{
    width:100%;
    padding:13px 15px;
    border:0;
    outline:0;
    border-radius:8px;
    background:#222;
    color:#fff;
    font-size:16px;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:10px;
}

/* VIDEO LIST */
.video-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

/* CARD */
.card{
    background:#1c1c1c;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid #292929;
}

.card:hover{
    background:#242424;
}

/* THUMBNAIL */
.thumbnail{
    width:100%;
    height:230px;
    background:#222;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.placeholder{
    color:#aaa;
    font-size:17px;
}

/* PLAY BUTTON */
.play-button{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:58px;
    height:58px;
    border-radius:50%;

    background:rgba(229,9,20,.95);
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
    padding-left:3px;

    z-index:5;
}

/* CARD INFO */
.card-info{
    padding:13px;
}

.card-info h3{
    margin:0 0 6px;
    font-size:18px;
}

.card-info p{
    margin:0;
    color:#999;
    font-size:13px;
}

/* AD */
.banner-ad{
    width:100%;
    min-height:70px;
    background:#181818;
    border:1px dashed #444;
    border-radius:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#777;
    font-size:14px;
}

/* =========================
   FULL SCREEN VIDEO PLAYER
========================= */

#player{
    display:none;

    position:fixed;
    z-index:9999;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:#000;
}

.player-top{
    width:100%;
    height:55px;

    display:flex;
    align-items:center;

    padding:0 10px;

    background:#111;
}

.close-btn{
    background:none;
    border:0;
    color:#fff;

    font-size:32px;

    width:45px;
    height:45px;

    cursor:pointer;
}

.player-title{
    margin-left:5px;

    font-size:17px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-video-box{
    width:100%;
    height:calc(100% - 55px);

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;
}

#videoPlayer{
    width:100%;
    max-height:100%;

    background:#000;
}

/* RECOMMENDED */
.recommended{
    margin-top:25px;
}

.recommended h2{
    font-size:20px;
    margin-bottom:12px;
}

.recommend-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.recommend-card{
    display:flex;
    gap:10px;

    background:#1c1c1c;
    padding:8px;

    border-radius:8px;

    cursor:pointer;
}

.recommend-thumb{
    width:110px;
    height:70px;

    background:#333;

    border-radius:5px;

    overflow:hidden;

    flex-shrink:0;
}

.recommend-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.recommend-info{
    padding:5px;
}

.recommend-info h3{
    margin:0;
    font-size:15px;
}

/* PAGINATION */
.pagination{
    display:flex;
    justify-content:center;
    gap:7px;
    margin:25px 0;
    flex-wrap:wrap;
}

.pagination button{
    border:0;
    background:#222;
    color:#fff;

    padding:9px 13px;

    border-radius:6px;

    cursor:pointer;
}

.pagination button.active{
    background:#e50914;
}

/* FOOTER */
footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:25px 10px;
}

/* MOBILE */
@media(max-width:600px){

    .thumbnail{
        height:210px;
    }

    header h1{
        font-size:21px;
    }

    .play-button{
        width:55px;
        height:55px;
        font-size:24px;
    }
}
</style>
</head>


<body>

<!-- HEADER -->
<header>

    <img
        src="logo.png"
        alt="Viral Link"
        class="site-logo"
    >

    <h1>Viral Link</h1>

</header>


<!-- SEARCH -->
<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="ভিডিও খুঁজুন..."
        oninput="searchVideos()"
    >

</div>


<!-- VIDEO LIST -->
<div class="container">

    <div
        id="videoList"
        class="video-list"
    ></div>


    <!-- PAGINATION -->
    <div
        id="pagination"
        class="pagination"
    ></div>


    <!-- RECOMMENDED -->
    <div class="recommended">

        <h2>Recommended Videos</h2>

        <div
            id="recommendList"
            class="recommend-list"
        ></div>

    </div>

</div>


<!-- =========================
     FULL SCREEN PLAYER
========================= -->

<div id="player">

    <div class="player-top">

        <button
            class="close-btn"
            onclick="closePlayer()"
        >
            ×
        </button>

        <div
            id="playerTitle"
            class="player-title"
        >
            Video
        </div>

    </div>


    <div class="player-video-box">

        <video
            id="videoPlayer"
            controls
            controlsList="nodownload"
            oncontextmenu="return false;"
        >

            <source
                id="videoSource"
                src=""
                type="video/mp4"
            >

        </video>

    </div>

</div>


<footer>
    © 2026 Viral Link
</footer>


<script>

/* =========================
   VIDEO DATA
========================= */

const videos = [

    {
        id:1,
        title:"আমার প্রথম ভিডিও",
        file:"salar1.mp4"
    },

    {
        id:2,
        title:"দ্বিতীয় ভিডিও",
        file:"video2.mp4"
    },

    {
        id:3,
        title:"New viral",
        file:"video3.mp4"
    },

    {
        id:4,
        title:"চতুর্থ ভিডিও",
        file:""
    },

    {
        id:5,
        title:"পঞ্চম ভিডিও",
        file:""
    },

    {
        id:6,
        title:"ষষ্ঠ ভিডিও",
        file:""
    },

    {
        id:7,
        title:"সপ্তম ভিডিও",
        file:""
    },

    {
        id:8,
        title:"অষ্টম ভিডিও",
        file:""
    },

    {
        id:9,
        title:"নবম ভিডিও",
        file:""
    },

    {
        id:10,
        title:"দশম ভিডিও",
        file:""
    },

    {
        id:11,
        title:"১১ নম্বর ভিডিও",
        file:""
    },

    {
        id:12,
        title:"১২ নম্বর ভিডিও",
        file:""
    }

];


const videosPerPage = 10;

let currentPage = 1;

let filteredVideos = videos;


/* =========================
   SHOW VIDEOS
========================= */

function showVideos(){

    const list =
        document.getElementById("videoList");

    list.innerHTML = "";


    const start =
        (currentPage - 1) * videosPerPage;

    const end =
        start + videosPerPage;


    const pageVideos =
        filteredVideos.slice(start,end);


    pageVideos.forEach(function(video,index){

        const card =
            document.createElement("div");

        card.className = "card";


        card.onclick = function(){

            if(video.file){

                playVideo(
                    video.file,
                    video.title
                );

            }

        };


        const thumbnail =
            document.createElement("div");

        thumbnail.className =
            "thumbnail";


        if(video.file){

            thumbnail.innerHTML = `

                <div class="placeholder">
                    Thumbnail loading...
                </div>

                <div class="play-button">
                    ▶
                </div>

            `;

            generateThumbnail(
                video.file,
                thumbnail
            );

        }
        else{

            thumbnail.innerHTML = `

                <div class="placeholder">
                    Video Coming Soon
                </div>

            `;

        }


        const info =
            document.createElement("div");

        info.className =
            "card-info";


        info.innerHTML = `

            <h3>
                ${video.title}
            </h3>

            <p>
                Video
            </p>

        `;


        card.appendChild(thumbnail);

        card.appendChild(info);

        list.appendChild(card);


        /* AD AFTER EVERY 2 VIDEOS */

        if(
            (index + 1) % 2 === 0 &&
            index !== pageVideos.length - 1
        ){

            const ad =
                document.createElement("div");

            ad.className =
                "banner-ad";

            ad.innerText =
                "ADVERTISEMENT";

            list.appendChild(ad);

        }

    });


    showPagination();

}


/* =========================
   THUMBNAIL
========================= */

function generateThumbnail(
    file,
    container
){

    const video =
        document.createElement("video");


    video.src =
        "./" + file;

    video.muted = true;

    video.preload = "metadata";


    video.addEventListener(
        "loadeddata",
        function(){

            try{

                video.currentTime = 1;

            }
            catch(e){

                createThumbnail(
                    video,
                    container
                );

            }

        }
    );


    video.addEventListener(
        "seeked",
        function(){

            createThumbnail(
                video,
                container
            );

        }
    );


    video.addEventListener(
        "error",
        function(){

            container.innerHTML = `

                <div class="placeholder">
                    Thumbnail unavailable
                </div>

                <div class="play-button">
                    ▶
                </div>

            `;

        }
    );

}


/* =========================
   CREATE THUMBNAIL
========================= */

function createThumbnail(
    video,
    container
){

    const canvas =
        document.createElement("canvas");


    canvas.width = 640;

    canvas.height = 360;


    const ctx =
        canvas.getContext("2d");


    try{

        ctx.drawImage(
            video,
            0,
            0,
            640,
            360
        );


        const image =
            document.createElement("img");


        image.src =
            canvas.toDataURL(
                "image/jpeg",
                0.85
            );


        image.alt =
            "Video thumbnail";


        container.innerHTML = "";

        container.appendChild(image);


        /* PLAY BUTTON */

        const play =
            document.createElement("div");

        play.className =
            "play-button";

        play.innerText =
            "▶";


        container.appendChild(play);

    }
    catch(e){

        container.innerHTML = `

            <div class="placeholder">
                Thumbnail unavailable
            </div>

            <div class="play-button">
                ▶
            </div>

        `;

    }

}


/* =========================
   PLAY VIDEO
========================= */

function playVideo(
    file,
    title
){

    const player =
        document.getElementById("player");

    const videoPlayer =
        document.getElementById("videoPlayer");

    const source =
        document.getElementById("videoSource");

    const playerTitle =
        document.getElementById("playerTitle");


    source.src =
        "./" + file;


    videoPlayer.load();


    playerTitle.innerText =
        title;


    player.style.display =
        "block";


    if(
        location.hash !== "#video"
    ){

        history.pushState(
            {videoPlayer:true},
            "",
            "#video"
        );

    }


    videoPlayer.play().catch(
        function(error){

            console.log(
                "Play error:",
                error
            );

        }
    );

}


/* =========================
   CLOSE VIDEO
========================= */

function closePlayer(){

    const player =
        document.getElementById("player");

    const videoPlayer =
        document.getElementById("videoPlayer");


    videoPlayer.pause();

    videoPlayer.currentTime = 0;

    player.style.display =
        "none";


    if(
        location.hash === "#video"
    ){

        history.back();

    }

}


/* =========================
   ANDROID BACK BUTTON
========================= */

window.addEventListener(
    "popstate",
    function(){

        const player =
            document.getElementById("player");

        const videoPlayer =
            document.getElementById("videoPlayer");


        if(
            player.style.display === "block"
        ){

            videoPlayer.pause();

            videoPlayer.currentTime = 0;

            player.style.display =
                "none";

        }

    }
);


/* =========================
   PAGINATION
========================= */

function showPagination(){

    const pagination =
        document.getElementById(
            "pagination"
        );


    pagination.innerHTML = "";


    const totalPages =
        Math.ceil(
            filteredVideos.length /
            videosPerPage
        );


    if(totalPages <= 1){

        return;

    }


    if(currentPage > 1){

        const previous =
            document.createElement("button");

        previous.innerText = "‹";

        previous.onclick =
            function(){

                currentPage--;

                showVideos();

                window.scrollTo(0,0);

            };

        pagination.appendChild(
            previous
        );

    }


    for(
        let i=1;
        i<=totalPages;
        i++
    ){

        const button =
            document.createElement("button");

        button.innerText = i;


        if(i === currentPage){

            button.className =
                "active";

        }


        button.onclick =
            function(){

                currentPage = i;

                showVideos();

                window.scrollTo(0,0);

            };


        pagination.appendChild(
            button
        );

    }


    if(
        currentPage < totalPages
    ){

        const next =
            document.createElement("button");

        next.innerText = "›";


        next.onclick =
            function(){

                currentPage++;

                showVideos();

                window.scrollTo(0,0);

            };


        pagination.appendChild(
            next
        );

    }

}


/* =========================
   SEARCH
========================= */

function searchVideos(){

    const input =
        document.getElementById(
            "searchInput"
        );


    const text =
        input.value
        .toLowerCase()
        .trim();


    filteredVideos =
        videos.filter(
            function(video){

                return video.title
                    .toLowerCase()
                    .includes(text);

            }
        );


    currentPage = 1;

    showVideos();

}


/* =========================
   RECOMMENDED
========================= */

function showRecommended(){

    const list =
        document.getElementById(
            "recommendList"
        );


    list.innerHTML = "";


    videos
    .filter(function(video){

        return video.file;

    })
    .slice(0,5)
    .forEach(function(video){

        const card =
            document.createElement("div");

        card.className =
            "recommend-card";


        card.onclick =
            function(){

                playVideo(
                    video.file,
                    video.title
                );

            };


        const thumb =
            document.createElement("div");

        thumb.className =
            "recommend-thumb";


        const img =
            document.createElement("img");


        img.alt =
            video.title;


        thumb.appendChild(img);


        makeRecommendedThumbnail(
            video.file,
            img
        );


        const info =
            document.createElement("div");

        info.className =
            "recommend-info";


        info.innerHTML = `

            <h3>
                ${video.title}
            </h3>

        `;


        card.appendChild(thumb);

        card.appendChild(info);

        list.appendChild(card);

    });

}


/* =========================
   RECOMMENDED THUMBNAIL
========================= */

function makeRecommendedThumbnail(
    file,
    image
){

    const video =
        document.createElement("video");


    video.src =
        "./" + file;

    video.muted = true;

    video.preload =
        "metadata";


    video.addEventListener(
        "loadeddata",
        function(){

            try{

                video.currentTime = 1;

            }
            catch(e){}

        }
    );


    video.addEventListener(
        "seeked",
        function(){

            const canvas =
                document.createElement("canvas");

            canvas.width = 320;

            canvas.height = 180;


            const ctx =
                canvas.getContext("2d");


            try{

                ctx.drawImage(
                    video,
                    0,
                    0,
                    320,
                    180
                );


                image.src =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.8
                    );

            }
            catch(e){}

        }
    );

}


/* =========================
   START
========================= */

showVideos();

showRecommended();

</script>

</body>
</html>
