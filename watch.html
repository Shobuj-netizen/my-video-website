<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Watch Video - Viral Link</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    padding:12px 10px;
    background:#151515;
    border-bottom:1px solid #292929;
}

.site-logo{
    width:55px;
    height:55px;
    object-fit:contain;
    display:block;
    margin:auto;
}

header h1{
    margin:5px 0 0;
    font-size:22px;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:10px;
}

.video-box{
    width:100%;
    background:#000;
    border-radius:10px;
    overflow:hidden;
}

#videoPlayer{
    width:100%;
    display:block;
    background:#000;
}

.video-title{
    padding:13px 5px;
    font-size:20px;
    font-weight:bold;
}

.banner-ad{
    width:100%;
    min-height:90px;
    margin:15px 0;
    background:#181818;
    border:1px dashed #444;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    font-size:14px;
}

.recommended{
    margin-top:20px;
}

.recommended h2{
    font-size:20px;
    margin-bottom:12px;
}

.recommend-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.recommend-card{
    display:flex;
    gap:10px;
    padding:8px;
    background:#1c1c1c;
    border-radius:8px;
    cursor:pointer;
}

.recommend-thumb{
    width:120px;
    height:75px;
    flex-shrink:0;
    background:#333;
    border-radius:5px;
    overflow:hidden;
}

.recommend-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.recommend-info{
    padding:5px;
}

.recommend-info h3{
    margin:0;
    font-size:16px;
}

.back-button{
    display:block;
    width:100%;
    margin:15px 0;
    padding:12px;
    background:#222;
    color:#fff;
    border:0;
    border-radius:7px;
    font-size:15px;
    cursor:pointer;
}

footer{
    text-align:center;
    color:#777;
    padding:25px 10px;
    font-size:13px;
}

@media(max-width:600px){

    .video-title{
        font-size:18px;
    }

    .recommend-thumb{
        width:105px;
        height:70px;
    }

}

</style>

</head>

<body>

<header>

<img
src="logo.png"
class="site-logo"
alt="Viral Link">

<h1>Viral Link</h1>

</header>


<div class="container">


<div class="video-box">

<video
id="videoPlayer"
controls
controlsList="nodownload"
oncontextmenu="return false;"
>

<source
id="videoSource"
src=""
type="video/mp4">

</video>

</div>


<div
id="videoTitle"
class="video-title">

Video

</div>


<div class="banner-ad">

ADVERTISEMENT

</div>


<div class="recommended">

<h2>
Recommended Videos
</h2>

<div
id="recommendList"
class="recommend-list">
</div>

</div>


<button
class="back-button"
onclick="history.back()">

← Back to Videos

</button>


</div>


<footer>

© 2026 Viral Link

</footer>


<!-- ভিডিওর তালিকা -->

<script src="videos.js"></script>


<script>


const params =
    new URLSearchParams(
        window.location.search
    );


const videoId =
    Number(
        params.get("video")
    );


const selectedVideo =
    videos.find(
        function(video){

            return video.id === videoId;

        }
    );


if(
    selectedVideo &&
    selectedVideo.file
){

    document.title =
        selectedVideo.title +
        " - Viral Link";


    document.getElementById(
        "videoTitle"
    ).innerText =
        selectedVideo.title;


    const source =
        document.getElementById(
            "videoSource"
        );


    const player =
        document.getElementById(
            "videoPlayer"
        );


    source.src =
        "./" +
        selectedVideo.file;


    player.load();


    player.play().catch(
        function(){}
    );

}


function showRecommended(){

    const list =
        document.getElementById(
            "recommendList"
        );


    list.innerHTML = "";


    videos

    .filter(
        function(video){

            return (
                video.file &&
                video.id !== videoId
            );

        }
    )

    .slice(0,5)

    .forEach(
        function(video){


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "recommend-card";


            card.onclick =
                function(){

                    window.location.href =
                        "watch.html?video=" +
                        video.id;

                };


            const thumb =
                document.createElement(
                    "div"
                );


            thumb.className =
                "recommend-thumb";


            const img =
                document.createElement(
                    "img"
                );


            img.alt =
                video.title;


            thumb.appendChild(img);


            makeThumbnail(
                video.file,
                img
            );


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "recommend-info";


            info.innerHTML = `
                <h3>
                    ${video.title}
                </h3>
            `;


            card.appendChild(
                thumb
            );


            card.appendChild(
                info
            );


            list.appendChild(
                card
            );

        }
    );

}


function makeThumbnail(
    file,
    image
){

    const video =
        document.createElement(
            "video"
        );


    video.src =
        "./" + file;


    video.muted = true;


    video.preload =
        "metadata";


    video.addEventListener(
        "loadeddata",
        function(){

            try{

                video.currentTime = 1;

            }
            catch(e){}

        }
    );


    video.addEventListener(
        "seeked",
        function(){

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width = 320;

            canvas.height = 180;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            try{

                ctx.drawImage(
                    video,
                    0,
                    0,
                    320,
                    180
                );


                image.src =
                    canvas.toDataURL(
                        "image/jpeg",
                        .8
                    );

            }
            catch(e){}

        }
    );

}


showRecommended();


</script>

</body>
</html>
